<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Kitchen League"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Kitchen League</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="claude:viewport-fit-sides" content="cover">
<!-- No web manifest on purpose: iPadOS would use its start_url and drop the pairing link when you add the page to the Home Screen. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="theme-color" content="#EEF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1015" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: kitchen scoreboard. Score band on top, then player A | chores | player B. League view: month race chart, head-to-head table, hall of fame. */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --ink:#14171E; --muted:#5B6271; --line:#D8DCE4; --track:#E4E7ED;
  --a:#2D52D1; --a-soft:#E2E8FC; --a-ink:#1B3699; --on-a:#FFFFFF;
  --b:#D6502A; --b-soft:#FBE5DC; --b-ink:#963013; --on-b:#FFFFFF;
  --good:#1C8F53; --warn:#B7791F; --sleep-bg:#000000; --sleep-ink:#4A4D55; --scrim:rgba(10,12,18,.55);
  --bronze:#B8692E; --silver:#8E98A8; --gold:#D9A21B;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1015; --surface:#171A21; --ink:#ECEEF3; --muted:#99A0AD; --line:#2A2E38; --track:#262A34;
  --a:#7894FF; --a-soft:#1C2446; --a-ink:#BFCBFF; --on-a:#0B0F1F;
  --b:#FF875C; --b-soft:#3B2119; --b-ink:#FFC4AE; --on-b:#1F0C05;
  --good:#4CD08A; --warn:#E8B04B; color-scheme:dark;
  --bronze:#D98A4E; --silver:#B4BDCB; --gold:#F2C23E;
}}
:root[data-theme="dark"]{
  --bg:#0E1015; --surface:#171A21; --ink:#ECEEF3; --muted:#99A0AD; --line:#2A2E38; --track:#262A34;
  --a:#7894FF; --a-soft:#1C2446; --a-ink:#BFCBFF; --on-a:#0B0F1F;
  --b:#FF875C; --b-soft:#3B2119; --b-ink:#FFC4AE; --on-b:#1F0C05;
  --good:#4CD08A; --warn:#E8B04B; color-scheme:dark;
  --bronze:#D98A4E; --silver:#B4BDCB; --gold:#F2C23E;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:28px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.tabs{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px}
.tab{min-height:38px;padding:0 18px;border-radius:999px;border:none;background:transparent;font-weight:700;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tmeta{color:var(--muted);font-weight:500}
.tact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on .dot{background:var(--good)}
.chip.warn .dot{background:var(--warn)}

.board{background:var(--surface);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;overflow:hidden}
.side{display:flex;flex-direction:row;align-items:center;gap:14px;padding:12px 18px;min-width:0}
.side.b{flex-direction:row-reverse;text-align:right}
.stext{display:flex;flex-direction:column;gap:2px;min-width:0}
.side.b .stext{align-items:flex-end}
.mood{font-size:13px;font-weight:700;font-style:italic}
.side.a .mood{color:var(--a-ink)} .side.b .mood{color:var(--b-ink)}

/* Avatars */
.av{width:108px;height:116px;flex:none}
.av svg{width:100%;height:100%;overflow:visible;display:block}
.av .bgc.a{fill:var(--a-soft)} .av .bgc.b{fill:var(--b-soft)}
.av .face{transform-box:view-box;transform-origin:60px 118px}
.av .eyes{transform-box:view-box;transform-origin:60px 64px}
.m-cry .face{animation:shake .22s linear infinite}
.m-sad .face{animation:droop 3.2s ease-in-out infinite}
.m-happy .face{animation:bob 2.2s ease-in-out infinite}
.m-laugh .face{animation:rock .42s ease-in-out infinite}
.m-shock .face{animation:jolt .5s ease-out 1}
.m-sleep .face{animation:breathe 4s ease-in-out infinite}
.m-yawn .face{animation:stretch 3.4s ease-in-out infinite}
.m-smug .face{animation:nod 1.6s ease-in-out infinite}
.m-party .face{animation:rock .42s ease-in-out infinite}
.m-meh .eyes,.m-happy .eyes,.m-sad .eyes{animation:blink 4.5s infinite}
.tear{transform-box:view-box;animation:fall 1.05s linear infinite}
.tear.t2{animation-delay:.35s} .tear.t3{animation-delay:.7s}
.joy.l{transform-box:view-box;animation:squirtL .8s ease-out infinite}
.joy.r{transform-box:view-box;animation:squirtR .8s ease-out infinite}
.joy.d2{animation-delay:.4s}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.3s ease-in-out infinite}
.spark.s2{animation-delay:.45s} .spark.s3{animation-delay:.9s}
.sweat{transform-box:view-box;animation:fall 2.4s ease-in infinite}
.zz{transform-box:fill-box;animation:floatz 3s ease-in-out infinite;font-family:var(--f-display);font-weight:800}
.zz.z2{animation-delay:1s} .zz.z3{animation-delay:2s}
.av.pop{animation:pop .7s ease-out 1}
@keyframes shake{0%,100%{transform:translateX(-1.6px) rotate(-1deg)}50%{transform:translateX(1.6px) rotate(1deg)}}
@keyframes droop{0%,100%{transform:rotate(-2deg) translateY(1px)}50%{transform:rotate(-5deg) translateY(4px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rock{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-5px)}}
@keyframes jolt{0%{transform:translateY(0) scale(1)}25%{transform:translateY(-10px) scale(1.08)}100%{transform:translateY(0) scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(30px);opacity:0}}
@keyframes squirtL{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-18px,10px);opacity:0}}
@keyframes squirtR{0%{transform:translate(0,0);opacity:1}100%{transform:translate(18px,10px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1);opacity:1}}
@keyframes floatz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(10px,-22px);opacity:0}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.2) translateY(-10px)}60%{transform:scale(.94)}100%{transform:scale(1)}}
@keyframes stretch{0%,100%{transform:scaleY(1)}45%,60%{transform:scaleY(1.05) rotate(-2deg)}}
@keyframes nod{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-2px)}}
#savs{display:flex;gap:28px;opacity:.4}
#savs .av{width:90px;height:98px}
.sname{font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.side.a .sname{color:var(--a)} .side.b .sname{color:var(--b)}
.snum{font-family:var(--f-display);font-weight:900;font-size:clamp(56px,8vw,96px);line-height:.9;font-variant-numeric:tabular-nums}
.side.a .snum{color:var(--a)} .side.b .snum{color:var(--b)}
.side.lead-off .snum{opacity:.55}
.ssub{color:var(--muted);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.vs{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--muted);line-height:1}
.leadline{grid-column:1 / -1;margin:0;padding:10px 22px;border-top:1px solid var(--line);font-weight:600;font-size:17px;text-wrap:balance}

.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"a chores b";align-items:start}
.panel{background:var(--surface);border-radius:var(--r);overflow:hidden;min-width:0}

.phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px}
.p-a .phead{background:var(--a);color:var(--on-a)}
.p-b .phead{background:var(--b);color:var(--on-b)}
.pname{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstreak{font-size:13px;font-weight:600;white-space:nowrap}
.meter{display:flex;flex-direction:column;gap:10px;padding:16px 16px 4px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mlabel{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mval{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.mval b{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--ink);letter-spacing:.01em}
.track{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:999px;transition:width .35s ease}
.p-a .fill{background:var(--a)} .p-b .fill{background:var(--b)}
.goal{font-size:13px;font-weight:700;color:var(--good)}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.btn{min-height:54px;border-radius:12px;border:none;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;transition:transform .08s ease}
.btn:active{transform:scale(.96)}
.p-a .btn{background:var(--a-soft);color:var(--a-ink)}
.p-b .btn{background:var(--b-soft);color:var(--b-ink)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 16px;margin-top:10px;border-top:1px solid var(--line)}
.breakdown{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.breakdown b{color:var(--ink)}
.link{background:none;border:1.5px solid var(--line);border-radius:10px;min-height:40px;padding:0 14px;font-weight:600;font-size:14px}
.link:disabled{opacity:.4}

.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.chead h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.chead span{color:var(--muted);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.clist{list-style:none;margin:0;padding:0 8px 8px;display:flex;flex-direction:column;gap:4px}
.crow{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:10px;align-items:center;padding:4px;border-radius:12px;transition:background .2s}
.crow.by-a{background:var(--a-soft)} .crow.by-b{background:var(--b-soft)}
.claim{width:56px;height:52px;border-radius:12px;border:2px dashed var(--line);background:transparent;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--muted);transition:transform .08s ease}
.claim:active{transform:scale(.94)}
.claim.on.a{background:var(--a);border:2px solid var(--a);color:var(--on-a)}
.claim.on.b{background:var(--b);border:2px solid var(--b);color:var(--on-b)}
.crow.by-a .claim.b,.crow.by-b .claim.a{opacity:.45}
.claim{position:relative;-webkit-touch-callout:none}
.crow.multi .claim{opacity:1}
.crow.multi .claim:not(.on){border-style:solid}
.claim .cnt{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:11px;background:var(--ink);color:var(--surface);font:700 13px/22px var(--f-body)}
.cname{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0}
.cname .t{font-weight:600;font-size:17px;line-height:1.2}
.cname .m{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.crow.by-a .cname .m{color:var(--a-ink)} .crow.by-b .cname .m{color:var(--b-ink)}
.cempty{padding:20px 16px;color:var(--muted)}
.rules{color:var(--muted);font-size:13px;margin:0;padding:0 4px;line-height:1.5}

/* League */
.mnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mnav h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(34px,5vw,48px);text-transform:uppercase;letter-spacing:.02em;line-height:1;min-width:0}
.arrow{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;line-height:1}
.arrow:disabled{opacity:.35}
.pill{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--track);color:var(--muted)}
.pill.a{background:var(--a);color:var(--on-a)} .pill.b{background:var(--b);color:var(--on-b)}
.lgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
.lhead{padding:14px 16px 4px}
.lhead h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.lhead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.chart{padding:8px 8px 12px}
.chart svg{display:block;width:100%;height:auto;max-width:100%}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:12px;font-weight:600}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.a{stroke:var(--a)} .chart .ln.b{stroke:var(--b)}
.chart .ar.a{fill:var(--a);opacity:.08} .chart .ar.b{fill:var(--b);opacity:.08}
.chart .dt.a{fill:var(--a)} .chart .dt.b{fill:var(--b)}
.chart text.va{fill:var(--a);font-weight:800;font-size:14px} .chart text.vb{fill:var(--b);font-weight:800;font-size:14px}
.chart .empty{fill:var(--muted);font-size:15px}
.legend{display:flex;gap:16px;padding:0 16px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.legend .a i{background:var(--a)} .legend .b i{background:var(--b)}
.h2h{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.h2h th,.h2h td{padding:11px 16px;border-top:1px solid var(--line);text-align:right;font-size:15px}
.h2h th:first-child,.h2h td:first-child{text-align:left;color:var(--muted);font-weight:600}
.h2h thead th{border-top:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.h2h thead th.a{color:var(--a)} .h2h thead th.b{color:var(--b)}
.h2h td.win.a{color:var(--a);font-weight:800} .h2h td.win.b{color:var(--b);font-weight:800}
.h2h td.sm{font-size:13px}
.tw{overflow-x:auto}
.fame{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.fame div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fame .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fame .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.fame .v .a{color:var(--a)} .fame .v .b{color:var(--b)} .fame .v .s{color:var(--muted);font-size:20px;padding:0 4px}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.mlist .mn{font-weight:700}
.mlist .sc{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.mlist button{background:none;border:none;padding:0;text-align:left;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.lempty{padding:14px 16px 18px;color:var(--muted);margin:0}

/* Trophies: one row per trophy, player A | trophy | player B, like the chore list */
.tlist{list-style:none;margin:0;padding:0}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.tmid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.tico{font-size:28px;line-height:1.1}
.tmid .t{font-weight:700;font-size:17px;line-height:1.2}
.tmid .m{font-size:13px;color:var(--muted);font-weight:500}
.tp{display:flex;flex-direction:column;gap:5px;min-width:0}
.tp.b{align-items:flex-end;text-align:right}
.pips{display:flex;gap:5px}
.pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}
.pip.t1{background:var(--bronze);border-color:var(--bronze)} .pip.t2{background:var(--silver);border-color:var(--silver)} .pip.t3{background:var(--gold);border-color:var(--gold)}
.tname{font-weight:700;font-size:15px}
.tp.a .tname{color:var(--a-ink)} .tp.b .tname{color:var(--b-ink)}
.tp .tname.none{color:var(--muted);font-weight:600}
.tbar{height:6px;border-radius:999px;background:var(--track);overflow:hidden;width:100%;max-width:220px}
.tbar i{display:block;height:100%;border-radius:999px;transition:width .35s ease}
.tp.a .tbar i{background:var(--a)} .tp.b .tbar i{background:var(--b)}
.tprog{font-size:13px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:2px;animation:confetti 2.4s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes confetti{100%{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}}

/* Timeline: player A's entries on the left, B's on the right, time and running score down the middle */
.tl{list-style:none;margin:0;padding:6px 0 14px;position:relative}
.tl::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line)}
.tli{display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);gap:10px;align-items:center;padding:4px 16px}
.tli>*{grid-row:1}
.tlt{grid-column:2;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);padding:4px 0}
.tlt .num{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1}
.tlsc{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

<div id="app"></div>
<div id="sleep" hidden role="button" aria-label="Wake screen"><div id="savs"></div><div class="clock" id="sclock"></div><div class="ss" id="sscore"></div></div>

<script>
/* SHARED START (also used by the Google Sheet backend) */
function blankDay(k){return{date:k,a:{water:0,protein:0,log:[]},b:{water:0,protein:0,log:[]},chores:{},seen:[]}}
function normDay(d,k){
  d=d&&typeof d==='object'?d:blankDay(k);
  ['a','b'].forEach(function(p){var x=d[p]=d[p]||{};x.water=+x.water||0;x.protein=+x.protein||0;x.log=Array.isArray(x.log)?x.log:[]});
  d.chores=d.chores&&typeof d.chores==='object'?d.chores:{};d.seen=Array.isArray(d.seen)?d.seen:[];d.date=k;return d;
}
function dayActive(d){if(!d)return false;return ['a','b'].some(function(p){return d[p]&&(d[p].water>0||d[p].protein>0)})||Object.keys(d.chores||{}).length>0}
function applyOp(d,o){
  if(o.id&&d.seen.indexOf(o.id)>=0)return d;
  if(o.t==='add'){var x=d[o.p];x[o.k]=(x[o.k]||0)+o.amt;x.log.push({k:o.k,a:o.amt,t:o.ts});if(x.log.length>40)x.log=x.log.slice(-40);if(o.tw){x.tw=o.tw;x.tp=o.tp}}
  else if(o.t==='undo'){var y=d[o.p],e=y.log.pop();if(e)y[e.k]=Math.max(0,(y[e.k]||0)-e.a)}
  else if(o.t==='claim'){if(o.by)d.chores[o.cid]={by:o.by,pts:o.pts,name:o.name,t:o.ts};else delete d.chores[o.cid]}
  else if(o.t==='clear'){var b=blankDay(d.date);d.a=b.a;d.b=b.b;d.chores={}}
  else if(o.t==='import'){if(!dayActive(d)&&o.day){var s=d.seen;d=normDay(JSON.parse(JSON.stringify(o.day)),d.date);d.seen=s}}
  if(o.id){d.seen.push(o.id);if(d.seen.length>80)d.seen=d.seen.slice(-80)}
  return d;
}
function scoreOf(d,p,t){
  var x=(d&&d[p])||{water:0,protein:0},hitW=x.water>=t.water,hitP=x.protein>=t.protein;
  var w=Math.round(Math.min(1,x.water/t.water)*15)+(hitW?5:0),pr=Math.round(Math.min(1,x.protein/t.protein)*15)+(hitP?5:0);
  var c=0,cn=0,ch=(d&&d.chores)||{};for(var id in ch){if(ch[id]&&ch[id].by===p){c+=ch[id].pts||0;cn++}}
  return{w:w,pr:pr,c:c,cn:cn,total:w+pr+c,hitW:hitW,hitP:hitP,water:x.water||0,protein:x.protein||0,t:t};
}
/* SHARED END */

(function(){
'use strict';
var DEF_CFG={
  names:{a:'Blue',b:'Orange'},
  targets:{a:{water:3000,protein:120},b:{water:2500,protein:90}},
  chores:[
    {id:'dishes',name:'Load or empty dishwasher',pts:10},
    {id:'counters',name:'Wipe counters and hob',pts:8},
    {id:'dinner',name:'Cook dinner',pts:15},
    {id:'wash',name:'Put a wash on',pts:8},
    {id:'fold',name:'Fold and put away laundry',pts:10},
    {id:'bins',name:'Bins and recycling out',pts:6},
    {id:'hoover',name:'Hoover downstairs',pts:12},
    {id:'tidy',name:'Ten-minute living room tidy',pts:6}
  ]
};
var P=['a','b'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var inArtifact=!!(window.claude&&typeof window.claude.use==='function');

/* utils */
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return(n<10?'0':'')+n}
function fmt(n){return Number(n).toLocaleString('en-GB')}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dateOf(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(k,n){var d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d)}
function mondayOf(k){var d=dateOf(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
function todayKey(){return keyOf(new Date())}
function ymLabel(ym){return MONTHS[+ym.slice(5,7)-1]+' '+ym.slice(0,4)}
function ymShift(ym,n){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function normCfg(c){
  var o=clone(DEF_CFG);if(!c||typeof c!=='object')return o;
  if(c.names)P.forEach(function(p){if(c.names[p])o.names[p]=String(c.names[p]).slice(0,24)});
  if(c.targets)P.forEach(function(p){var t=c.targets[p]||{};if(t.water>0)o.targets[p].water=+t.water;if(t.protein>0)o.targets[p].protein=+t.protein});
  if(Array.isArray(c.chores))o.chores=c.chores.filter(function(x){return x&&x.id&&x.name}).map(function(x){var y={id:String(x.id),name:String(x.name).slice(0,60),pts:Math.max(1,Math.min(50,Math.round(+x.pts||5)))};if(x.multi)y.multi=true;return y});
  return o;
}

/* state */
var S={cfg:normCfg(LS.get('kl.cfg',null)),base:LS.get('kl.days',{})||{},pending:LS.get('kl.pending',[])||[],days:{},view:'today',month:todayKey().slice(0,7),mode:'local'};
var dev=Object.assign({idle:90,sens:6,motion:false},LS.get('kl.dev',{}));
var sheet=LS.get('kl.sheet',null);
var sync={state:'idle',since:LS.get('kl.since',0)||0,cfgPending:LS.get('kl.cfgPending',false)};
function saveDev(){LS.set('kl.dev',dev)}
Object.keys(S.base).forEach(function(k){S.base[k]=normDay(S.base[k],k)});

function recompute(){
  var days=Object.assign({},S.base),cl={};
  S.pending.forEach(function(o){
    if(!cl[o.date]){days[o.date]=normDay(days[o.date]?clone(days[o.date]):null,o.date);cl[o.date]=1}
    days[o.date]=applyOp(days[o.date],o);
  });
  S.days=days;
}
function saveBase(){LS.set('kl.days',S.base)}

/* ---------- storage modes: Google Sheet (hosted), cloud db (artifact), this device ---------- */
var db=null,timers={},inflight={},dirty={},ver={},cfgDirty=false,cfgVer=0;
function dispatch(op){
  op.id=uid();op.ts=Date.now();op.date=op.date||todayKey();
  if(S.mode==='sheet'){S.pending.push(op);LS.set('kl.pending',S.pending);recompute();render();scheduleFlush(250);return}
  S.base[op.date]=applyOp(normDay(S.base[op.date]?clone(S.base[op.date]):null,op.date),op);
  saveBase();recompute();render();
  if(S.mode==='db')markDirty(op.date);
}
function saveCfg(){
  LS.set('kl.cfg',S.cfg);
  if(S.mode==='sheet'){sync.cfgPending=true;LS.set('kl.cfgPending',true);scheduleFlush(100)}
  else if(S.mode==='db'){
    cfgDirty=true;var v=++cfgVer;
    db.doc('config/main').set(clone(S.cfg)).then(function(){if(v===cfgVer)cfgDirty=false},function(){cfgDirty=false;toast("Couldn't save settings to the cloud.")});
  }
}
/* cloud db (inside Claude) */
function connectDb(){
  if(!inArtifact)return;
  window.claude.use('db').then(function(d){
    if(!d)return;db=d;S.mode='db';
    try{
      db.doc('config/main').onSnapshot(function(s){if(s.exists&&!cfgDirty){S.cfg=normCfg(s.data());LS.set('kl.cfg',S.cfg);render()}},function(){});
      db.collection('days').onSnapshot(function(qs){
        var next={};
        qs.docs.forEach(function(doc){if(doc.exists)next[doc.id]=normDay(clone(doc.data()),doc.id)});
        Object.keys(dirty).forEach(function(k){if(S.base[k])next[k]=S.base[k]});
        if(qs.empty&&!qs.metadata.fromCache&&Object.keys(S.base).length){Object.keys(S.base).forEach(function(k){next[k]=S.base[k];markDirty(k)})}
        if(!connectDb.loaded){connectDb.loaded=true;achQuiet=true}
        S.base=next;saveBase();recompute();render();
      },function(){});
    }catch(e){db=null;S.mode='local'}
    render();
  }).catch(function(){});
}
function markDirty(k){dirty[k]=1;ver[k]=(ver[k]||0)+1;clearTimeout(timers[k]);timers[k]=setTimeout(function(){flushDoc(k)},600)}
function flushDoc(k){
  if(!db){delete dirty[k];return}
  if(inflight[k]){timers[k]=setTimeout(function(){flushDoc(k)},400);return}
  var v=ver[k],body=clone(S.base[k]);inflight[k]=true;
  db.doc('days/'+k).set(body).then(function(){inflight[k]=false;if(ver[k]===v)delete dirty[k]},function(e){
    inflight[k]=false;
    if(e&&e.code==='unavailable')timers[k]=setTimeout(function(){flushDoc(k)},1500+Math.random()*1500);
    else{delete dirty[k];toast("Couldn't save to the cloud, so this is kept on this device only.")}
  });
}
/* Google Sheet (hosted copy) */
var flushT=null,flushing=false,pullT=null;
function sheetUrl(params){var u=sheet.url;return u+(u.indexOf('?')<0?'?':'&')+params}
// Apps Script answers with an HTML page when the deployment is wrong or not yet authorised
function readJson(r){return r.json().catch(function(){throw new Error('The sheet sent back a web page instead of scores. Check the deployment is a Web app that Anyone can access, and that Set up has been run once in the sheet.')})}
function mergeDays(days){Object.keys(days||{}).forEach(function(k){S.base[k]=normDay(days[k],k)})}
function pull(full){
  if(S.mode!=='sheet')return Promise.resolve();
  // ask for a minute of overlap: a save that lands while a read is in flight can carry an older timestamp
  var since=full?0:Math.max(0,sync.since-60000);
  return fetch(sheetUrl('key='+encodeURIComponent(sheet.key)+'&since='+since),{cache:'no-store'}).then(readJson).then(function(j){
    if(!j.ok)throw new Error(j.error||'Sheet refused the request');
    mergeDays(j.days);
    if(j.config&&!sync.cfgPending){S.cfg=normCfg(j.config);LS.set('kl.cfg',S.cfg)}
    sync.since=j.now||sync.since;LS.set('kl.since',sync.since);
    if(!S.pending.length&&!sync.cfgPending)sync.state='ok';
    saveBase();recompute();render();return j;
  }).catch(function(e){sync.state='offline';sync.err=String(e&&e.message||e);render();throw e});
}
function scheduleFlush(ms){clearTimeout(flushT);flushT=setTimeout(flush,ms)}
function flush(){
  if(S.mode!=='sheet'||flushing)return;
  if(!S.pending.length&&!sync.cfgPending){sync.state='ok';return}
  flushing=true;sync.state='saving';render();
  var batch=S.pending.slice(0,40),sentCfg=sync.cfgPending,body={key:sheet.key,ops:batch};
  if(sentCfg)body.config=S.cfg;
  fetch(sheet.url,{method:'POST',body:JSON.stringify(body)}).then(readJson).then(function(j){
    if(!j.ok)throw new Error(j.error||'Sheet refused the save');
    var ids={};batch.forEach(function(o){ids[o.id]=1});
    S.pending=S.pending.filter(function(o){return!ids[o.id]});LS.set('kl.pending',S.pending);
    if(sentCfg){sync.cfgPending=false;LS.set('kl.cfgPending',false)}
    mergeDays(j.days);saveBase();
    flushing=false;sync.state=S.pending.length?'saving':'ok';recompute();render();
    if(S.pending.length)scheduleFlush(50);
  }).catch(function(e){
    flushing=false;sync.state='offline';sync.err=String(e&&e.message||e);render();scheduleFlush(15000);
  });
}
function startPolling(){
  clearInterval(pullT);
  pullT=setInterval(function(){
    if(S.mode!=='sheet'||document.visibilityState!=='visible')return;
    if(sleeping&&Date.now()-(pull.last||0)<120000)return;
    pull.last=Date.now();pull(false).catch(function(){});flush();
  },30000);
}
function connectSheet(url,key){
  url=url.trim();key=key.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url))return Promise.reject(new Error('That doesn\'t look like an Apps Script web app address. It should start with https://script.google.com/'));
  if(!key)return Promise.reject(new Error('Enter the key from Kitchen League > Set up in your Google Sheet.'));
  return fetch(url+(url.indexOf('?')<0?'?':'&')+'key='+encodeURIComponent(key)+'&since=0',{cache:'no-store'}).then(readJson).then(function(j){
    if(!j.ok)throw new Error(j.error||'The sheet refused the key');
    var local=S.days,hadLocal=Object.keys(local).filter(function(k){return dayActive(local[k])});
    sheet={url:url,key:key};LS.set('kl.sheet',sheet);S.mode='sheet';
    var remote=j.days||{};
    S.pending=[];
    hadLocal.forEach(function(k){if(!dayActive(remote[k]))S.pending.push({t:'import',id:uid(),ts:Date.now(),date:k,day:local[k]})});
    LS.set('kl.pending',S.pending);var copied=S.pending.length;
    S.base={};mergeDays(remote);
    if(j.config){S.cfg=normCfg(j.config);LS.set('kl.cfg',S.cfg);sync.cfgPending=false}else{sync.cfgPending=true}
    LS.set('kl.cfgPending',sync.cfgPending);
    sync.since=j.now||0;LS.set('kl.since',sync.since);LS.set('kl.unpaired',null);
    achQuiet=true;saveBase();recompute();render();startPolling();flush();
    return copied;
  });
}
function disconnectSheet(){
  LS.set('kl.unpaired',sheet&&sheet.url);
  sheet=null;LS.set('kl.sheet',null);S.mode='local';S.pending=[];LS.set('kl.pending',[]);clearInterval(pullT);
  if(parsePair(location.href)){try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}}
  S.base=clone(S.days);saveBase();recompute();render();
}
/* pairing link: index.html#sync=<web app address>&key=<key>. The hash never reaches the web host. */
function pairLink(){return location.href.split('#')[0]+'#sync='+encodeURIComponent(sheet.url)+'&key='+encodeURIComponent(sheet.key)}
function parsePair(s){
  s=String(s||'');var i=s.indexOf('#');if(i<0)return null;
  var q=new URLSearchParams(s.slice(i+1)),u=q.get('sync'),k=q.get('key');return u&&k?{url:u.trim(),key:k.trim()}:null;
}
function takePairLink(){
  var link=parsePair(location.href);if(!link||inArtifact)return;
  var standalone=navigator.standalone===true||!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  // In an iPad Safari tab keep the link in the address bar, so Add to Home Screen carries it into the Home Screen app
  if(navigator.standalone!==false){try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}}
  if(sheet&&sheet.url===link.url&&sheet.key===link.key)return;
  // a Home Screen app relaunches with the link it was saved with, so respect an earlier Disconnect
  if(standalone&&LS.get('kl.unpaired',null)===link.url)return;
  var local=Object.keys(S.days).filter(function(k){return dayActive(S.days[k])}).length;

function leadLine(s,day){
  var N=S.cfg.names,ch=(day&&day.chores)||{};
  if(s.a.total===0&&s.b.total===0)return 'New day, level scores. First glass of water takes the lead.';
  var open=S.cfg.chores.filter(function(c){return!c.multi&&!ch[c.id]}).sort(function(x,y){return y.pts-x.pts})[0];
  if(s.a.total===s.b.total)return 'All square on '+s.a.total+'. '+(open?'"'+esc(open.name)+'" (+'+open.pts+') breaks the tie.':'Next sip of water breaks the tie.');
  var lead=s.a.total>s.b.total?'a':'b',trail=lead==='a'?'b':'a',gap=Math.abs(s.a.total-s.b.total);
  var line=esc(N[lead])+' leads by '+gap+'. ';
  if(open)line+=esc(N[trail])+', "'+esc(open.name)+'" is worth +'+open.pts+(open.pts>gap?' and puts you ahead.':open.pts===gap?' and levels it.':'.');
  else if(!s[trail].hitW)line+=esc(N[trail])+', chores are gone, so drink up.';
  else if(!s[trail].hitP)line+=esc(N[trail])+', chores are gone, so it comes down to protein.';
  else line+='Everything is claimed. Good game.';
  return line;
}
function meter(p,kind,s){
  var isW=kind==='water',val=isW?s.water:s.protein,tgt=isW?s.t.water:s.t.protein,hit=isW?s.hitW:s.hitP;
  var pct=Math.min(100,Math.round(val/tgt*100)),shown=isW?(val/1000).toFixed(2).replace(/0$/,''):Math.round(val);
  var amts=isW?[100,250,500]:[10,20,30];
  return '<div class="meter"><div class="mrow"><span class="mlabel">'+(isW?'Water':'Protein')+'</span>'+(hit?'<span class="goal">Goal hit, +5</span>':'')+
    '<span class="mval"><b>'+shown+'</b> / '+(isW?(tgt/1000).toFixed(1)+' L':tgt+' g')+'</span></div>'+
    '<div class="track" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100" aria-label="'+(isW?'Water':'Protein')+' progress"><div class="fill" style="width:'+pct+'%"></div></div>'+
    '<div class="btns">'+amts.map(function(a){return '<button class="btn" data-act="add" data-p="'+p+'" data-k="'+kind+'" data-amt="'+a+'">+'+a+(isW?' ml':' g')+'</button>'}).join('')+'</div></div>';
}

function niceStep(raw){var p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function raceSvg(ms){
  var W=660,H=260,L=46,R=64,Tp=16,B=32;
  if(!ms.last||(ms.tot.a===0&&ms.tot.b===0))return '<svg viewBox="0 0 '+W+' 120" role="img" aria-label="No points yet"><text class="empty" x="'+W/2+'" y="64" text-anchor="middle">No points yet this month. The first glass of water starts the race.</text></svg>';
  var max=Math.max(ms.tot.a,ms.tot.b,10),step=niceStep(max/4),top=Math.ceil(max/step)*step;
  function x(i){return L+(ms.dim===1?0:(i-1)/(ms.dim-1))*(W-L-R)}
  function y(v){return Tp+(1-v/top)*(H-Tp-B)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Running points total for each player across '+ymLabel(ms.ym)+'">';
  for(var v=0;v<=top+0.001;v+=step)s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+fmt(v)+'</text>';
  [1,8,15,22,29].filter(function(d){return d<=ms.dim}).forEach(function(d){s+='<text x="'+x(d).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+d+'</text>'});
  var ends={};
  P.forEach(function(p){
    var pts=ms.cum[p].map(function(v,i){return x(i+1).toFixed(1)+','+y(v).toFixed(1)});
    if(pts.length===1)pts.unshift(x(1).toFixed(1)+','+y(0).toFixed(1));
    s+='<polygon class="ar '+p+'" points="'+x(1).toFixed(1)+','+y(0).toFixed(1)+' '+pts.join(' ')+' '+x(ms.last).toFixed(1)+','+y(0).toFixed(1)+'"/>';
    s+='<polyline class="ln '+p+'" points="'+pts.join(' ')+'"/>';
    ends[p]={x:x(ms.last),y:y(ms.tot[p])};
  });
  var ya=ends.a.y,yb=ends.b.y;
  if(Math.abs(ya-yb)<16){var mid=(ya+yb)/2,up=ms.tot.a>=ms.tot.b?'a':'b';if(up==='a'){ya=mid-9;yb=mid+9}else{yb=mid-9;ya=mid+9}}

  return s+'</svg>';
}

/* ---------- timeline: one day's entries in time order, replayed to get each entry's points and the running score ---------- */
// Undo and take-one-off delete entries, and a steal keeps only the final owner, so this shows what still counts
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function dayEvents(d,k){
  if(!d)return[];
  var ev=[];
  P.forEach(function(p){d[p].log.forEach(function(e){if(e&&(e.k==='water'||e.k==='protein'))ev.push({t:+e.t||0,p:p,kind:e.k,amt:+e.a||0})})});
  Object.keys(d.chores).forEach(function(key){var c=d.chores[key];if(c&&c.by)ev.push({t:+c.t||0,p:c.by,kind:'chore',key:key,base:key.split('~')[0],name:c.name||key,pts:c.pts||0})});
  ev.sort(function(x,y){return x.t-y.t});
  var tg={a:targetsFor(d,'a',k),b:targetsFor(d,'b',k)},syn={a:{water:0,protein:0},b:{water:0,protein:0},chores:{}};
  var prev={a:scoreOf(syn,'a',tg.a),b:scoreOf(syn,'b',tg.b)},lead=null,nth={};
  ev.forEach(function(e,i){
    if(e.kind==='chore'){syn.chores[e.key]={by:e.p,pts:e.pts};nth[e.p+e.base]=(nth[e.p+e.base]||0)+1;e.nth=e.key.indexOf('~')>0?nth[e.p+e.base]:0}
    else syn[e.p][e.kind]+=e.amt;
    var now={a:scoreOf(syn,'a',tg.a),b:scoreOf(syn,'b',tg.b)},l=now.a.total>now.b.total?'a':now.b.total>now.a.total?'b':null;
    e.gain=now[e.p].total-prev[e.p].total;
    e.hit=e.kind==='water'?now[e.p].hitW&&!prev[e.p].hitW:e.kind==='protein'?now[e.p].hitP&&!prev[e.p].hitP:false;
    e.score={a:now.a.total,b:now.b.total};
    e.tag=i===0&&e.gain>0?'First on the board':l===e.p&&lead!==l&&i>0?'Takes the lead':'';
    lead=l;prev=now;
  });
  return ev;
}
function renderTimeline(T){
  var N=S.cfg.names,k=S.tlDay&&S.tlDay<=T?S.tlDay:T,d=S.days[k],ev=dayEvents(d,k);
  var earliest=Object.keys(S.days).filter(function(x){return dayActive(S.days[x])}).sort()[0]||T;
  var fin={a:pscore(d,'a',k).total,b:pscore(d,'b',k).total},win=fin.a>fin.b?'a':fin.b>fin.a?'b':null;
  var swaps=ev.filter(function(e){return e.tag==='Takes the lead'}).length;

  var html='<div class="mnav"><button class="arrow" data-act="tlday" data-d="-1" aria-label="Previous day"'+(k<=earliest?' disabled':'')+'>‹</button>'+
    '<h1>'+dateOf(k).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+'</h1>'+
    '<button class="arrow" data-act="tlday" data-d="1" aria-label="Next day"'+(k>=T?' disabled':'')+'>›</button>'+
    '<span class="pill'+(k<T&&win?' '+win:'')+'">'+pill+'</span></div>';
  html+='<section class="panel"><div class="lhead"><h2>Timeline</h2><p>'+esc(N.a)+' '+fin.a+' · '+esc(N.b)+' '+fin.b+' · '+ev.length+' thing'+(ev.length===1?'':'s')+' logged'+(swaps?' · lead changed '+swaps+' time'+(swaps===1?'':'s'):'')+'</p></div>';
  if(!ev.length)html+='<p class="lempty">Nothing logged on this day.</p>';
  else html+='<ol class="tl">'+ev.map(function(e){
    var icon=e.kind==='water'?'💧':e.kind==='protein'?'🥚':'🧽';
    var what=e.kind==='water'?'+'+fmt(e.amt)+' ml water':e.kind==='protein'?'+'+fmt(e.amt)+' g protein':esc(e.name)+(e.nth>1?' ('+ord(e.nth)+' today)':'');
    var sub=(e.gain>0?'+'+e.gain+' pt'+(e.gain===1?'':'s'):'No extra points')+
      (e.hit?' · <span class="hit">'+(e.kind==='water'?'Water':'Protein')+' target hit</span>':'')+(e.tag?' · <span class="tag">'+e.tag+'</span>':'');
    var at=e.t?new Date(e.t):null,tm=at?pad(at.getHours())+':'+pad(at.getMinutes()):'--:--';
    return '<li class="tli"><div class="tle '+e.p+'"><span class="tlw">'+icon+' <b>'+esc(N[e.p])+'</b> '+what+'</span><span class="tls">'+sub+'</span></div>'+
      '<div class="tlt"><span class="num">'+tm+'</span><span class="tlsc" aria-label="Score '+esc(N.a)+' '+e.score.a+', '+esc(N.b)+' '+e.score.b+'"><i class="a">'+e.score.a+'</i> – <i class="b">'+e.score.b+'</i></span></div></li>';
  }).join('')+'</ol>';
  return html+'</section>';
}

/* ---------- actions ---------- */
function add(p,kind,amt){
  var T=todayKey(),before=pscore(S.days[T],p,T),t=S.cfg.targets[p];
  setReact(p,'pop',700);
  dispatch({t:'add',p:p,k:kind,amt:amt,tw:t.water,tp:t.protein});
  var after=pscore(S.days[T],p,T),N=S.cfg.names[p];
  if(kind==='water'&&after.hitW&&!before.hitW)toast(N+' hit the water target. +5 bonus');
  else if(kind==='protein'&&after.hitP&&!before.hitP)toast(N+' hit the protein target. +5 bonus');
}
function undo(p){
  var T=todayKey(),d=S.days[T],e=d&&d[p].log[d[p].log.length-1];if(!e)return;
  dispatch({t:'undo',p:p});toast('Removed '+e.a+(e.k==='water'?' ml water':' g protein')+' for '+S.cfg.names[p]);
}
function claim(id,p){
  var T=todayKey(),d=S.days[T],c=S.cfg.chores.filter(function(x){return x.id===id})[0];if(!c)return;
  var cur=d&&d.chores[id],N=S.cfg.names;
  if(cur&&cur.by===p){dispatch({t:'claim',cid:id,by:null});toast(N[p]+' unclaimed "'+c.name+'"');return}
  if(cur&&cur.by){setReact(p,'smug',1900);setReact(cur.by,'shock',1900)}else setReact(p,'pop',700);
  dispatch({t:'claim',cid:id,by:p,pts:c.pts,name:c.name});
  toast(cur?N[p]+' took "'+c.name+'" from '+N[cur.by]:N[p]+' +'+c.pts+': '+c.name);
}
// A chore that repeats stores each go as its own claim keyed "<choreId>~<unique>", so scoring and the Sheet backend need no change
function repKeys(ch,id){return Object.keys(ch||{}).filter(function(k){return ch[k]&&ch[k].by&&(k===id||k.indexOf(id+'~')===0)})}
function rep(id,p){
  var c=S.cfg.chores.filter(function(x){return x.id===id})[0];if(!c)return;
  setReact(p,'pop',700);
  dispatch({t:'claim',cid:id+'~'+uid(),by:p,pts:c.pts,name:c.name});
  var ch=S.days[todayKey()].chores,n=repKeys(ch,id).filter(function(k){return ch[k].by===p}).length;
  toast(S.cfg.names[p]+' +'+c.pts+': '+c.name+(n>1?' ('+n+' today)':''));
}
function unrep(id,p){
  var d=S.days[todayKey()],c=S.cfg.chores.filter(function(x){return x.id===id})[0];if(!d||!c)return;
  var mine=repKeys(d.chores,id).filter(function(k){return d.chores[k].by===p}).sort(function(x,y){return(d.chores[x].t||0)-(d.chores[y].t||0)});
  if(!mine.length)return;
  dispatch({t:'claim',cid:mine[mine.length-1],by:null});toast('Took one "'+c.name+'" off '+S.cfg.names[p]);
}
// press and hold a repeat button to take one off; the click that follows the hold is swallowed
var holdT=null,held=false;
app.addEventListener('pointerdown',function(e){
  var b=e.target.closest('[data-act="rep"]');held=false;clearTimeout(holdT);if(!b)return;
  holdT=setTimeout(function(){held=true;unrep(b.dataset.id,b.dataset.p)},600);
});
['pointerup','pointercancel','pointerleave'].forEach(function(t){app.addEventListener(t,function(){clearTimeout(holdT)},true)});
app.addEventListener('contextmenu',function(e){if(e.target.closest('[data-act="rep"]'))e.preventDefault()});
app.addEventListener('click',function(e){

/* ---------- motion wake: front camera, frame differencing ---------- */
var vid=document.getElementById('cam'),cv=document.createElement('canvas');cv.width=32;cv.height=24;
var cx=cv.getContext('2d',{willReadFrequently:true});
var cam={stream:null,timer:null,prev:null,level:0};
function threshold(){return 28-dev.sens*2.4}
function startMotion(fromTap){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){if(fromTap)toast("This view can't use the camera. Open the iPad version to get motion wake.");return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:160},height:{ideal:120}},audio:false}).then(function(st){
    stopStream();cam.stream=st;vid.srcObject=st;var pl=vid.play();if(pl&&pl.catch)pl.catch(function(){});
    cam.prev=null;cam.timer=setInterval(sample,400);dev.motion=true;saveDev();render();
    if(fromTap)toast('Motion wake on. The screen lights up when someone walks in.');
  }).catch(function(){dev.motion=false;saveDev();render();if(fromTap)toast("Camera wasn't allowed, so motion wake is off. Tap the screen to wake it instead.")});
}
function stopStream(){clearInterval(cam.timer);cam.timer=null;if(cam.stream)cam.stream.getTracks().forEach(function(t){t.stop()});cam.stream=null}

function sample(){
  if(vid.readyState<2)return;try{cx.drawImage(vid,0,0,32,24)}catch(e){return}
  var px=cx.getImageData(0,0,32,24).data,g=new Uint8Array(768),s=0,i;
  for(i=0;i<768;i++)g[i]=(px[i*4]*3+px[i*4+1]*4+px[i*4+2])>>3;
  if(cam.prev){for(i=0;i<768;i++)s+=Math.abs(g[i]-cam.prev[i]);cam.level=s/768;if(cam.level>threshold()){lastActive=Date.now();if(sleeping)wake()}}
  cam.prev=g;var lv=document.getElementById('lvlbar');if(lv)lv.style.width=Math.min(100,cam.level/30*100)+'%';
}

    }
    else h+='<div class="fgrid"><div class="field"><label for="su">Web app address or pairing link</label><input id="su" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(draft.sheetUrl)+'"></div>'+
      '<div class="field"><label for="sk">Key</label><input id="sk" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(draft.sheetKey)+'"></div></div>'+
      '<div class="srow"><button class="sbtn primary" data-s="conn"'+(connecting?' disabled':'')+'>'+(connecting?'Connecting…':'Connect')+'</button></div>'+
      '<p class="note">Paste the address and key from the <b>Kitchen League &gt; Set up</b> menu in your Google Sheet, or a pairing link from a device that is already connected (then the key fills itself in). Scores already on this device are copied into the sheet when you connect.</p>';
    h+='</div>';
  }else{
    h+='<div><h3>Sync</h3><p class="note">'+(S.mode==='db'?'Scores save to your Claude account, so they show up wherever you open this page.':'Scores are kept in this browser.')+'</p></div>';
  }
  h+='<div><h3>This screen</h3><div class="fgrid"><div class="field"><label for="idle">Go dark after</label><select id="idle">'+
    [[30,'30 seconds'],[60,'1 minute'],[90,'90 seconds'],[120,'2 minutes'],[300,'5 minutes'],[600,'10 minutes']].map(function(o){return '<option value="'+o[0]+'"'+(draft.dev.idle===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'+
    '<div class="field"><label for="sens">Motion sensitivity</label><input id="sens" type="range" min="1" max="10" step="1" value="'+draft.dev.sens+'">'+
    '<div class="lvl" aria-hidden="true"><i id="lvlbar"></i><b id="lvlmark" style="left:'+Math.min(100,(28-draft.dev.sens*2.4)/30*100)+'%"></b></div></div></div>'+
    '<p class="note">'+(camOk?(cam.stream?'Camera is running. Wave at the screen: the green bar should cross the line. If it fires when nobody is there, lower the sensitivity.':'Turn on motion wake from the top bar, then come back here to tune it.'):"Motion wake needs the camera, which isn't available in this view. It works when the page is opened from its own web address on the iPad.")+'</p></div>';
  h+='<div><h3>Today</h3><button class="sbtn danger" data-s="clear">'+(clearArmed?'Tap again to clear today':'Clear today\'s scores')+'</button></div>';
  h+='<div class="sactions"><button class="sbtn" data-s="cancel">Cancel</button><button class="sbtn primary" data-s="save">Save</button></div></div>';
  modal.innerHTML=h;
  if(document.getElementById('qr'))drawQr();
  var sens=document.getElementById('sens');
  sens.addEventListener('input',function(){var m=document.getElementById('lvlmark');if(m)m.style.left=Math.min(100,(28-sens.value*2.4)/30*100)+'%';dev.sens=+sens.value});
}
modal.addEventListener('click',function(e){
  if(e.target===modal){closeSettings(false);return}
  var b=e.target.closest('[data-s]');if(!b||b.disabled)return;var s=b.dataset.s;
  if(s==='cancel')closeSettings(false);
  else if(s==='save')closeSettings(true);
  else if(s==='addchore'){readDraft();draft.cfg.chores.push({id:'c'+uid(),name:'New chore',pts:8});drawSettings()}
  else if(s==='rm'){readDraft();draft.cfg.chores=draft.cfg.chores.filter(function(c){return c.id!==b.dataset.id});drawSettings()}
  else if(s==='clear'){
    readDraft();
    if(!clearArmed){clearArmed=true;drawSettings();setTimeout(function(){if(clearArmed&&!modal.hidden){readDraft();clearArmed=false;drawSettings()}},3500)}
    else{dispatch({t:'clear'});clearArmed=false;drawSettings();toast("Today's scores cleared")}
  }
  else if(s==='share'){navigator.share({title:'Kitchen League',text:'Open this to connect Kitchen League to our Google Sheet.',url:pairLink()}).catch(function(){})}
  else if(s==='copy'){
    var link=pairLink();
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(function(){toast('Pairing link copied')},function(){toast("Couldn't copy the link here. Try the Share button.")});
    else toast("Couldn't copy the link here. Try the Share button.");
  }
  else if(s==='conn'){
    readDraft();var pr=parsePair(draft.sheetUrl);if(pr){draft.sheetUrl=pr.url;draft.sheetKey=pr.key}
    connecting=true;drawSettings();
    connectSheet(draft.sheetUrl||'',draft.sheetKey||'').then(function(n){
      connecting=false;draft.cfg=clone(S.cfg);drawSettings();
      toast(n?'Connected. Copying '+n+' day'+(n===1?'':'s')+' from this device into the sheet.':'Connected to your Google Sheet.');
    },function(err){connecting=false;drawSettings();toast(err&&err.message&&err.message.length<140?err.message:"Couldn't reach the sheet. Check the address, the key, and that the web app is deployed with access for Anyone.")});
  }
  else if(s==='disc'){readDraft();disconnectSheet();drawSettings();toast('Disconnected. Scores now stay on this device.')}
});
function closeSettings(save){
  if(save){
    readDraft();draft.cfg.chores=draft.cfg.chores.filter(function(c){return c.name});
    S.cfg=normCfg(draft.cfg);saveCfg();dev.idle=draft.dev.idle;dev.sens=draft.dev.sens;saveDev();toast('Settings saved');
  }else if(draft){dev.sens=draft.dev.sens}
  draft=null;modal.hidden=true;modal.innerHTML='';lastActive=Date.now();render();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!modal.hidden)closeSettings(false)});

/* ---------- boot ---------- */
if(sheet&&!inArtifact){S.mode='sheet';sync.state=S.pending.length?'saving':'ok'}
recompute();render();keepAwake();
if(S.mode==='sheet'){pull(false).catch(function(){});flush();startPolling()}
else connectDb();
if(dev.motion)startMotion(false);
takePairLink();window.addEventListener('hashchange',takePairLink);
// offline shell for the hosted copy: the kitchen iPad still opens if the Wi-Fi drops
if('serviceWorker' in navigator&&location.protocol==='https:'&&!inArtifact)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>

</body></html>
